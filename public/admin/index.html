<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Dashboard</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>SPM Admin</h1>
        <p id="adminName">Admin</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/index.html" class="active">
          <span class="icon">&#128202;</span> Dashboard
        </a>
        <a href="/admin/anomali.html">
          <span class="icon">&#9888;&#65039;</span> Monitoring Anomali
        </a>
        <a href="/admin/keberatan.html">
          <span class="icon">&#128221;</span> Form Keberatan
        </a>
        <a href="/admin/pengurus.html">
          <span class="icon">&#128101;</span> Kepengurusan
        </a>
        <a href="#" onclick="AdminAuth.logout()" style="margin-top:auto;">
          <span class="icon">&#128682;</span> Logout
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <div class="realtime-badge" id="sseBadge">
          <span class="dot"></span> Live
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card danger">
          <div class="label">Total Anomali</div>
          <div class="value" id="statAnomali">-</div>
        </div>
        <div class="stat-card warning">
          <div class="label">Overcounted</div>
          <div class="value" id="statOver">-</div>
        </div>
        <div class="stat-card primary">
          <div class="label">Undercounted</div>
          <div class="value" id="statUnder">-</div>
        </div>
        <div class="stat-card success">
          <div class="label">Terverifikasi</div>
          <div class="value" id="statMatch">-</div>
        </div>
      </div>

      <!-- Tabel Anomali Terbaru -->
      <div class="table-container">
        <div class="table-header">
          <h2>Anomali Terbaru</h2>
          <a href="/admin/anomali.html" class="btn btn-sm btn-outline">Lihat Semua</a>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>TPS</th>
                <th>Wilayah</th>
                <th>Suara Saksi</th>
                <th>Suara KPU</th>
                <th>Selisih</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="anomaliTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Notifikasi -->
      <div class="table-container">
        <div class="table-header">
          <h2>Notifikasi Terbaru</h2>
        </div>
        <div id="notifList" style="padding:16px;"></div>
      </div>
    </main>
  </div>

  <script src="/admin/js/admin-auth.js"></script>
  <script src="/admin/js/admin-api.js"></script>
  <script>
    if (!AdminAuth.requireAuth()) throw new Error('Not authenticated');

    const user = AdminAuth.getUser();
    document.getElementById('adminName').textContent = user?.name || 'Admin';

    // --- Load Stats ---
    async function loadStats() {
      try {
        const result = await adminApi.getRekapList({ limit: 1000 });
        const data = result.data || [];

        const over = data.filter(d => d.statusAnomali === 'MISMATCH_KPU_OVER').length;
        const under = data.filter(d => d.statusAnomali === 'MISMATCH_KPU_UNDER').length;
        const match = data.filter(d => d.statusAnomali === 'MATCH').length;
        const pending = data.filter(d => d.statusAnomali === 'BELUM_TERVERIFIKASI').length;

        document.getElementById('statAnomali').textContent = formatNumber(over + under);
        document.getElementById('statOver').textContent = formatNumber(over);
        document.getElementById('statUnder').textContent = formatNumber(under);
        document.getElementById('statMatch').textContent = formatNumber(match + pending);
      } catch (e) {
        console.error('Stats error:', e);
      }
    }

    // --- Load Anomali Table ---
    async function loadAnomali() {
      const tbody = document.getElementById('anomaliTable');
      try {
        const result = await adminApi.getRekapList({
          statusAnomali: 'MISMATCH_KPU_OVER',
          limit: 5,
        });

        const result2 = await adminApi.getRekapList({
          statusAnomali: 'MISMATCH_KPU_UNDER',
          limit: 5,
        });

        const all = [...(result.data || []), ...(result2.data || [])]
          .sort((a, b) => new Date(b.inputSaksiTimestamp || 0) - new Date(a.inputSaksiTimestamp || 0))
          .slice(0, 5);

        if (all.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada anomali terdeteksi</td></tr>';
          return;
        }

        tbody.innerHTML = all.map(item => {
          const statusClass = item.statusAnomali === 'MISMATCH_KPU_OVER' ? 'status-mismatch' : 'status-pending';
          const statusLabel = item.statusAnomali === 'MISMATCH_KPU_OVER' ? 'Overcounted' : 'Undercounted';

          return `
            <tr>
              <td><strong>TPS ${item.noTps}</strong></td>
              <td>${item.kelurahan}, ${item.kecamatan}</td>
              <td>${formatNumber(item.suaraPartaiSaksi)}</td>
              <td>${formatNumber(item.totalSuaraKpu)}</td>
              <td style="color:var(--danger);font-weight:600;">${item.selisihSuara > 0 ? '+' : ''}${formatNumber(item.selisihSuara)}</td>
              <td><span class="status ${statusClass}">${statusLabel}</span></td>
              <td><a href="/admin/anomali.html?tps=${item.idTps}" class="btn btn-sm btn-outline">Detail</a></td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7">Error: ${e.message}</td></tr>`;
      }
    }

    // --- Load Notifications ---
    async function loadNotifications() {
      const container = document.getElementById('notifList');
      try {
        const result = await adminApi.getNotifications(1, 5);
        if (!result.data || result.data.length === 0) {
          container.innerHTML = '<div class="empty-state">Tidak ada notifikasi</div>';
          return;
        }

        container.innerHTML = result.data.map(n => `
          <div style="padding:10px;border-left:3px solid ${n.isRead ? 'var(--gray-300)' : 'var(--primary)'};margin-bottom:8px;background:var(--gray-50);border-radius:0 8px 8px 0;">
            <div style="font-weight:600;font-size:0.875rem;">${escapeHtml(n.title)}</div>
            <div style="font-size:0.8125rem;color:var(--gray-500);margin-top:4px;">${timeAgo(n.createdAt)}</div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div>Error: ${e.message}</div>`;
      }
    }

    // --- SSE Real-time ---
    function connectSSE() {
      adminApi.connectSSE((data) => {
        if (data.type === 'NEW_NOTIFICATION') {
          showToast(`Notifikasi baru: ${data.title}`, 'info');
          loadNotifications();
          loadStats();
        }
      });
    }

    // --- Init ---
    loadStats();
    loadAnomali();
    loadNotifications();
    connectSSE();

    // Refresh setiap 30 detik
    setInterval(() => {
      loadStats();
      loadAnomali();
      loadNotifications();
    }, 30000);
  </script>
</body>
</html>
